name: Deploy wiki site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "graph/**"
      - "mkdocs.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site dependencies
        run: pip install mkdocs-material mkdocs-roamlinks-plugin

      - name: Copy graph into docs
        run: cp graph/graph.html wiki/graph.html

      - name: Build site
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
